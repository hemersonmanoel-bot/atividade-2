<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Site</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
    }

    .box{
      background:#1e293b;
      padding:40px;
      border-radius:20px;
      width:80%;
      max-width:500px;
    }

    h1{

    }

    a{
      display:inline-block;
      margin-top:20px;
      padding:12px 20px;
      background:#38bdf8;
      color:black;
      text-decoration:none;
      border-radius:10px;
      font-weight:bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Bem-vindo ao Meu Site</h1>

    <p>
      Site criado por Hemerson para atividade prática.
    </p>

    <a href="https://github.com" target="_blank">
      Visitar GitHub
    </a>
  </div>

</body>
</html>
